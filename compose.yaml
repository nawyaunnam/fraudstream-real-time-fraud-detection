name: fraudstream
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudstream
      POSTGRES_PASSWORD: fraudstream
      POSTGRES_DB: fraudstream
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fraudstream"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: {test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 5s, retries: 20}
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 5s, timeout: 3s, retries: 20}
  worker:
    build: .
    command: python -m app.worker
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  generator:
    build: .
    command: python -m app.generator
    env_file: [.env]
    depends_on:
      kafka: {condition: service_healthy}
  ingest:
    build: ./ingest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8080:8080"]
    depends_on:
      kafka: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
